name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App ID (Package Name) - change to install as a new app'
        required: false
        default: 'pk.elitechocolate.pos.v2'
      app_name:
        description: 'App Display Name'
        required: false
        default: 'CocoaDesk'
      version_name:
        description: 'Version Name'
        required: false
        default: '1.3.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Configure App Identity
        run: |
          TARGET_APP_ID="${{ github.event.inputs.app_id || 'pk.elitechocolate.pos.v2' }}"
          TARGET_APP_NAME="${{ github.event.inputs.app_name || 'CocoaDesk' }}"
          echo "Setting App ID: $TARGET_APP_ID"
          echo "Setting App Name: $TARGET_APP_NAME"
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            config.appId = '$TARGET_APP_ID';
            config.appName = '$TARGET_APP_NAME';
            fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          "

      - name: Build web app (on-device / local data mode)
        run: npm run build:apk
        env:
          VITE_DATA_MODE: local

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore signing keystore from secrets
        id: signing
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] \
            || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets not set — building a debug APK instead of a signed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          # tr strips any newlines a copy-paste of the base64 may have introduced
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > keystore/elite-release.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: frontend/android
        env:
          APP_ID: ${{ github.event.inputs.app_id || 'pk.elitechocolate.pos.v2' }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.3.0' }}
          VERSION_CODE: ${{ github.run_number || 4 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elite-chocolate-apk
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
