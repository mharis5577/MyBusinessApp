import java.io.FileInputStream

apply plugin: 'com.android.application'

// Signing config comes from keystore.properties locally, or env vars in CI.
// Neither the keystore nor its passwords belong in version control.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSigning = { String key, String envName ->
    keystoreProperties[key] ?: System.getenv(envName)
}

def storeFilePath = resolveSigning('storeFile', 'ANDROID_KEYSTORE_PATH') ?: 'keystore/elite-release.jks'
def releaseStoreFile = rootProject.file(storeFilePath)
def releaseStorePassword = resolveSigning('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = resolveSigning('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = resolveSigning('keyPassword', 'ANDROID_KEY_PASSWORD')

def hasReleaseKey = releaseStoreFile.exists() &&
    releaseStorePassword && releaseKeyAlias && releaseKeyPassword

def appPackageId = System.getenv('APP_ID') ?: 'pk.elitechocolate.pos.v2'
def appVersionCode = (System.getenv('VERSION_CODE') ?: '4').toInteger()
def appVersionName = System.getenv('VERSION_NAME') ?: '1.3.0'

android {
    namespace = "pk.elitechocolate.pos.test"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId appPackageId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile releaseStoreFile
                storePassword releaseStorePassword
            }
        }
    }
    buildTypes {
        debug {
            // Debug keeps the default debug key so debug APKs can never pose as a release build.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// An unsigned release APK cannot update an installed app, so fail instead of shipping one.
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    doFirst {
        if (!hasReleaseKey) {
            throw new GradleException(
                "Release signing is not configured.\n" +
                "Provide frontend/android/keystore.properties (storeFile, storePassword, keyAlias, keyPassword)\n" +
                "or set ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
