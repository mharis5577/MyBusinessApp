<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=9" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ELITE CHOCOLATE — POS & Bills</title>
    <meta name="description" content="ELITE CHOCOLATE POS & Bills — invoices, stock, payments, and offline-friendly PWA." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f2eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Elite Chocolate" />
    <style>
      html, body { background: #0c0c0b; margin: 0; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f2eb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var t = localStorage.getItem('elite-chocolate-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
